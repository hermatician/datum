# datum firmware config

# Bluetooth signal power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Deep sleep — disconnects after 30 minutes idle, saves power
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Eager debouncing — lower input lag
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Keyboard name
CONFIG_ZMK_KEYBOARD_NAME="datum"

# NKRO for home row mods
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
